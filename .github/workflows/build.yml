name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: |
          unzip -q OsoGoldTV-Pro-GitHub.zip -d extracted
          SUB=$(find extracted -name "settings.gradle*" -exec dirname {} \; | head -n 1)
          cp -rn "$SUB"/. .
          chmod +x gradlew
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - name: Build
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: OsoGoldTV-APK
          path: app/build/outputs/apk/debug/*.apk
