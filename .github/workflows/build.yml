name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: |
          unzip -q OsoGoldTV-Pro-GitHub.zip -d extracted
          SUB=$(find extracted -name "settings.gradle*" -exec dirname {} \; | head -n 1)
          cp -r "$SUB"/. .
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: OsoGoldTV-APK
          path: app/build/outputs/apk/debug/*.apk
